name: Root
type: root-doc
description: "The root documents: the front page, the operating docs, the license, the owners, the package manifest and the git ignores and attributes."
mapping:
  - "*.md"
  - LICENSE
  - CODEOWNERS
  - package.json
  - .gitignore
  - .gitattributes
relations:
  - target: method
    type: uses
  - target: rails
    type: uses
  - target: workspace
    type: uses
  - target: skills
    type: uses
  - target: family
    type: uses
  - target: releases
    type: uses
